[project]
name = "claimsafe"
version = "1.0.0"
description = "Supplement commerce ML: a health-claim checker under Regulation (EU) 432/2012, claims-grounded search and advice, a run-out model on a Vertex AI / Prefect pipeline, drift and rollback, GDPR erasure"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "lightgbm>=4.1",
  "duckdb>=1.0", "sqlglot>=25", "rank-bm25>=0.2", "faiss-cpu>=1.8", "httpx>=0.27", "fastapi>=0.110",
  "kfp>=2.7", "prefect>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
gcp = ["google-cloud-aiplatform>=1.60", "google-cloud-bigquery>=3.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM105", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_catalog.py" = ["E501"]
"scripts/report.py" = ["E501"]
