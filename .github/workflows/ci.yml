name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env: { DO_NOT_TRACK: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests scripts && ruff check src tests scripts
      - run: pytest -q
      - name: Held-out files unchanged since they were pinned
        run: grep -v '^#' config/heldout.lock | sha256sum -c -
      - name: Dev claim set still passes
        run: PYTHONPATH=src python scripts/evaluate_claims.py dev
      - name: Vertex AI spec compiles to the committed file
        run: |
          PYTHONPATH=src python -c 'from pathlib import Path; from claimsafe.pipeline.vertex import compile_pipeline; compile_pipeline(Path("pipelines/replenishment.yaml"))'
          git diff --exit-code -- pipelines/replenishment.yaml
      - name: Report regenerates unchanged from the committed benchmark files
        run: |
          PYTHONPATH=src python scripts/report.py > /dev/null
          git diff --exit-code -- RESULTS.md web/public/data/dashboard.json
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx tsc --noEmit && npx eslint src test && npx vitest run && npx vite build
